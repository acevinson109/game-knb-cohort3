 /* pyramid / ko */
 if(ko||s.ph==='champion'&&s.kt.length){upd($('pyr'),`<div class="ko">${kt(s,s.kt[0])}<div>${qh(s)}</div>${kt(s,s.kt[1])}</div>`);upd($('qpop'),'');$('teams').style.display='none'}
 else{$('teams').style.display='';upd($('pyr'),pyr(s));upd($('qpop'),qh(s));upd($('teams'),o.map(id=>{const t=T[id],tg=q&&q.st==='move'&&q.mv.m==='atras'&&!q.mv.tg&&q.buz===id?0:q&&q.st==='move'&&q.mv.m==='atras'&&!q.mv.tg&&tgs(s,q.buz).includes(id);
  return`<div class="tc ${q&&q.buz===id?'buz':''} ${s.ph==='elimdone'&&!t.qual?'out':''} ${tg?'tg':''}" style="--c:${t.c}" ${tg?`data-tg="${id}"`:''}><img src="${purl[id]||''}"><b>${esc(t.n)}</b><small>${t.qual?'★ QUALIFIED':'▲'+t.path.length+(t.at?'':' · no ATRAS')}</small>${q&&q.bn&&q.bn.id===id?'<div class="tag"><span>TOO<br>EARLY!</span></div>':s.ph==='elimdone'&&!t.qual?'<div class="tag el"><span>ELIMINATED<br>:(<br>BETTER LUCK<br>NEXT TIME!</span></div>':''}</div>`}).join(''))}
 /* timer */
 const tm=$('tm');if(tm&&q){tm.textContent=Math.ceil(q.tl);tm.className='tm'+(q.tl<=5&&q.st!=='head'?' r':'')}
 /* side */
 upd($('lb'),[...o].sort((a,b)=>rk(T[b])-rk(T[a])).map((id,i)=>{const t=T[id];return`<div class="lbr" style="--n:${o.length}"><b>${i+1}</b><img src="${purl[id]||''}"><span style="color:${t.c}">${esc(t.n)}</span><em>${t.p}pt ▲${t.path.length}${ko||s.ph==='champion'?' ⚔'+t.k:''}</em></div>`}).join('')||'<small>No teams yet</small>');
 if(h)$('pc').textContent='Players joined: '+o.length+' · online: '+o.filter(id=>T[id].online!==false).length;else upd($('me'),T[me]?`<h3>YOUR TEAM</h3><b style="color:${T[me].c}">${esc(T[me].n)}</b><br><small>Press SPACE to buzz · ATRAS KA: ${T[me].at?'used':'ready'}</small>`:'');
 if(h)upd($('ctl'),{lobby:`<button class="btn g" data-act="go" ${o.length<2?'disabled':''}>START</button>`,elim:ctl(s),ko:ctl(s),elimdone:`<button class="btn g" data-act="ko">START KNOCKOUT</button><button class="btn" data-act="end">END</button>`}[s.ph]||'');
 /* overlay */
 let ov='';if(s.pa)ov='<div class="ov"><h1>PAUSED</h1>'+(h?'<button class="btn y" data-act="pz">RESUME</button>':'<h3>Waiting for the host to resume…</h3>')+'</div>';else if(s.ph==='ended')ov='<div class="ov"><h1>GAME ENDED</h1><h3>Thanks for playing!</h3></div>';
 else if(s.ph==='champion'){const w=T[s.w];ov=`<div class="ov champ"><h3>🏆 CHAMPION 🏆</h3><img src="${purl[s.w]||''}"><h1 style="color:${w.c}">${esc(w.n)}</h1></div>`}
 upd($('ov'),ov);if(s.ph==='champion'&&!fxOn)fxStart();if(s.ph==='ended'&&fxOn){fxOn=false;P=[];cx.clearRect(0,0,cv.width,cv.height)}
 sfx(ps,s);ps=s}
const rk=t=>t.k*1000+(t.qual?500:0)+t.path.length*10+t.p;
const ctl=s=>`<button class="btn y" data-act="pz">${s.pa?'RESUME':'PAUSE'}</button><button class="btn" data-act="end">END</button>`;
function kt(s,id){const t=s.T[id],q=s.q;return`<div class="kt ${q&&q.buz===id?'buz':''}" style="--c:${t.c}"><img src="${purl[id]||''}"><b>${esc(t.n)}</b><h1>${t.k}</h1>${q&&q.bn&&q.bn.id===id?'<div class="tag"><span>TOO<br>EARLY!</span></div>':''}</div>`}
function pyr(s){const q=s.q,occ={},cur={};for(const id of s.o){const p=s.T[id].path;p.forEach(b=>(occ[b]=occ[b]||[]).push(id));if(p.length)(cur[p[p.length-1]]=cur[p[p.length-1]]||[]).push(id)}
 let sel=[];if(q&&q.st==='move'&&q.mv.m&&!(q.mv.m==='atras'&&!q.mv.tg))sel=fwd(s.T[q.buz].path).map(String);
 let h='<div class="pin">';for(let r=4;r>=0;r--)for(let c=0;c<5-r;c++){const k=r+','+c,cs=(occ[k]||[]).map(i=>s.T[i].c),cu=(cur[k]||[]).map(i=>s.T[i].c);
  const f=cs.slice(0,3).map(x=>`drop-shadow(0 0 7px ${x}) drop-shadow(0 0 16px ${x})`).join(' ');
  const bg=cs.length?`linear-gradient(160deg,#fff7 0,#0000 45%),linear-gradient(135deg,${cs.length>1?cs.join(','):cs[0]+','+cs[0]})`:'';
  h+=`<div class="hf ${sel.includes(k)?'sel':''} ${cu.length?'cur':''}" ${sel.includes(k)?`data-blk="${k}"`:''} style="left:calc(var(--w)*${c+r*.5});top:calc(var(--w)*${(4-r)*.866});${f?'filter:'+f:''}"><div class="hw"><div class="hx" style="${bg?'background:'+bg:''}"></div></div><div class="dots">${r===4&&!cu.length?'★':''}${cu.map(x=>`<u style="background:${x}"></u>`).join('')}</div></div>`}
 return h+'</div>'}
function qh(s){const q=s.q,T=s.T,mine=q&&q.buz===me&&role==='player',ko=s.ph==='ko';
 if(s.ph==='lobby')return`<div class="qp"><h3 style="font-size:2.4vh">Waiting for teams…</h3><p class="hint">${role==='host'?'Share the room code, then press START when everyone has joined.':'Waiting for the host to start.'}</p></div>`;
 if(s.ph==='elimdone')return`<div class="qp"><h3 style="font-size:2.4vh">Top 2 are through to the Knockout Round!</h3><p class="qx">${s.o.filter(i=>T[i].qual).slice(0,2).map(i=>esc(T[i].n)).join(' & ')}</p></div>`;
 if(!q)return'';
 if(q.st==='move'){const t=T[q.buz],m=q.mv;let b;
  if(!m.m)b=mine?`<button class="btn g" data-mv="abanti">ABANTI!</button>${!t.at&&tgs(s,q.buz).length?'<button class="btn" data-mv="atras">ATRAS KA!</button>':''}`:`<span class="hint">${esc(t.n)} is choosing…</span>`;
  else b=`<span class="hint">${m.m==='atras'&&!m.tg?'Pick a team below to send back 1 block':'Pick a glowing block to climb ▲'}</span>`;
  return`<div class="qp mvb"><span class="qx">✔ ${esc(t.n)} is correct!</span>${b}<span id="tm" class="tm"></span></div>`}
 if(q.st==='steal')return`<div class="qp steal"><h1>STEAL!</h1><p class="hint">Other teams can answer — get ready!</p></div>`;
 const can=mine&&q.st==='answer',hint=q.st==='head'?'GET READY — do not press SPACE yet!':q.st==='open'?'Press SPACE to buzz in!':q.st==='answer'?esc(T[q.buz].n)+' is answering…':q.rev>=0&&q.e?esc(q.e):'';
 return`<div class="qp"><div class="qh"><span>${ko?'':'Q'+q.n}</span><span id="tm" class="tm"></span></div><p class="qx">${esc(q.x)}</p><div class="cs">${q.ch.map((c,i)=>`<div class="ch ${ko?'big':''} ${q.rev===i?'ok':''} ${q.sel===i&&q.rev!==i?'bad':''} ${can?'can':''}" ${can?`data-i="${i}"`:''}>${ko?'':'ABCD'[i]+'. '}${esc(c)}</div>`).join('')}</div><p class="hint">${hint}</p></div>`}
function sfx(p,s){const a=p&&p.q,b=s.q;if(!b)return;if(b.st==='head'&&a&&a.st==='head'&&Math.ceil(a.tl)!==Math.ceil(b.tl))snd(S_TK);
 if(!a||a.st!==b.st){if(b.st==='open')snd(S_GO);if(b.st==='answer')snd(S_BUZ);if(b.st==='steal')snd(S_BAD);if(b.st==='move'||(b.st==='rev'&&b.rev>=0&&b.sel===b.rev))snd(S_OK)}
 if(b.bn&&!(a&&a.bn))snd(S_BAD);if(s.ph==='champion'&&(!p||p.ph!=='champion'))snd(S_OK)}
/* ---------- confetti & fireworks ---------- */
const cv=$('fx'),cx=cv.getContext('2d');let P=[],fxOn=false,fr=0;
function fxStart(){fxOn=true;cv.width=innerWidth;cv.height=innerHeight;requestAnimationFrame(fxLoop)}
function burst(x,y){const c=`hsl(${Math.random()*360},100%,60%)`;for(let i=0;i<70;i++){const a=Math.random()*6.28,v=2+Math.random()*5;P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:.06,l:70,c,r:2.2,f:1})}}
function fxLoop(){if(!fxOn)return;fr++;cx.clearRect(0,0,cv.width,cv.height);
 for(let i=0;i<4;i++)P.push({x:Math.random()*cv.width,y:-10,vx:Math.random()*2-1,vy:2+Math.random()*3,g:.02,l:300,c:`hsl(${Math.random()*360},90%,60%)`,r:4,f:0});
 if(fr%35===0)burst(cv.width*(.15+Math.random()*.7),cv.height*(.15+Math.random()*.4));
 P=P.filter(p=>p.l>0&&p.y<cv.height+20);for(const p of P){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.l--;cx.globalAlpha=p.f?Math.min(1,p.l/30):1;cx.fillStyle=p.c;p.f?(cx.beginPath(),cx.arc(p.x,p.y,p.r,0,6.28),cx.fill()):cx.fillRect(p.x,p.y,p.r*1.6,p.r)}
 requestAnimationFrame(fxLoop)}
addEventListener('resize',()=>{cv.width=innerWidth;cv.height=innerHeight});
</script></body></html>
